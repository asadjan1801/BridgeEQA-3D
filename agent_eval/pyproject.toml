[project]
name = "skit"
version = "0.1.0"
description = "Scene Analysis Tool Kit - ETL pipeline to extract data from inspection reports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.24,<3",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.25",
    "sqlmodel>=0.0.24",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.22.0",
    "blake3>=1.0.5",
    "tenacity>=8.2.3",
    "ruff>=0.12.2",
    "pytest>=8.4.1",
    "openai>=1.91.0",
    "vggt",
    "torch<3",
    "torchvision<0.23",
    "torchaudio<3",
    "matplotlib>=3.10.3,<4",
    "fastapi[standard]>=0.116.1,<0.117",
    "logfire[google-genai,litellm]>=4.3.3",
    "openai-agents[litellm,viz]>=0.2.3",
    "trimesh>=4.7.3",
    "pycolmap>=3.10,<3.11",
    "lightglue",
    "hydra-core>=1.3.2",
    "gradio>=5.42.0",
    "scipy>=1.16.1",
    "huggingface-hub[cli,torch]>=0.33.5",
    "transformers>=4.46.0",
    "torchao>=0.12.0",
    "scikit-learn>=1.7.1",
    "plotly>=6.3.0",
    "xformers>=0.0.31.post1",
    "asyncpg>=0.30.0",
    "opencv-contrib-python-headless>=4.11.0.86",
    "nest-asyncio>=1.6.0",
    "opencv-contrib-python>=4.11.0.86",
    "kaleido>=1.1.0",
    "boto3>=1.40.38",
    "diskcache>=5.6.3",
    "openinference-instrumentation-litellm>=0.1.25",
    "google-cloud-storage>=3.4.0",
    "pyarrow>=21.0.0",
    "chromadb>=0.5.0",
    "streamlit>=1.50.0",
    "wandb>=0.22.1",
    "weave>=0.52.8",
    "notebook>=7.4.7",
    "docling>=2.55.1",
    "sentencepiece>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skit"]

[project.scripts]
etl-pipeline = "skit.etl.pipeline:main"
pdf_parser = "skit.etl.stages.pdf_parser:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
skit = { workspace = true }
lightglue = { git = "https://github.com/cvg/LightGlue.git" }
vggt = { git = "https://github.com/facebookresearch/vggt.git" }

[pypi-options]
index-url = "https://download.pytorch.org/whl/cu128"
